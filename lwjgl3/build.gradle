// Desktop launcher, built on the LWJGL3 backend. Also owns the distribution tasks: see
// `dist` and `executable` at the bottom of this file.

plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'com.codeheadsystems.towerstack.lwjgl3.Lwjgl3Launcher'
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

// --- Distribution -------------------------------------------------------------------
//
// One file, every desktop OS. This works without any extra dependencies because the runtime
// classpath already carries natives for all of them — Linux x64/arm32/arm64/riscv64, Windows
// x64/x86, macOS x64/arm64 — and they never collide: LWJGL namespaces its natives by
// `<os>/<arch>/`, and libGDX's sit at the jar root under distinct filenames. LWJGL and
// gdx-jnigen-loader each pick the right one for the host at runtime and unpack it.
//
// Rolled by hand rather than with a shading plugin: the merge needs nothing clever (there are
// no service files and no signed jars to deal with), so this keeps the build plugin-free and
// buildable offline.

def distributionName = 'tower-stack'

tasks.register('dist', Jar) {
    group = 'distribution'
    description = 'Builds one self-contained jar that runs on Linux, Windows and macOS.'

    archiveFileName = "${distributionName}.jar"
    destinationDirectory = layout.buildDirectory.dir('dist')
    manifest.attributes 'Main-Class': application.mainClass.get()

    from sourceSets.main.output
    from({ configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }) {
        // Every dependency brings its own manifest, and the multi-release module-info files
        // collide across the LWJGL native jars. None of it matters on the classpath.
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/versions/*/module-info.class'
        exclude 'module-info.class'
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE // first one in wins; LICENSE files and such
}

// The player-facing README, kept as a real file under src/release rather than as a string in
// this script so it can be read and edited like the document it is. Deliberately NOT src/dist,
// which the `application` plugin would sweep into its own distZip — a different archive, whose
// contents these instructions do not describe.
// Declares the one file it writes rather than using a Copy task, whose output is its whole
// destination directory — which `dist` and `executable` also write into, leaving Gradle unable
// to order them.
tasks.register('distReadme') {
    group = 'distribution'
    description = 'Copies the player-facing README alongside the distributable jar.'

    def source = layout.projectDirectory.file('src/release/README.md')
    def target = layout.buildDirectory.file('dist/README.md')
    inputs.file(source)
    outputs.file(target)

    doLast {
        def out = target.get().asFile
        out.parentFile.mkdirs()
        java.nio.file.Files.copy(source.asFile.toPath(), out.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

tasks.register('executable') {
    group = 'distribution'
    description = 'Wraps the distributable jar in a shell stub so it runs directly on Unix.'
    dependsOn tasks.named('dist')

    def jarFile = tasks.named('dist', Jar).flatMap { it.archiveFile }
    def outputFile = layout.buildDirectory.file("dist/${distributionName}")
    inputs.file(jarFile)
    outputs.file(outputFile)

    doLast {
        // A zip's index is found from the end of the file, so a jar tolerates arbitrary bytes
        // in front of it: the same file is a runnable shell script on Linux/macOS AND a valid
        // jar for `java -jar` on Windows.
        def stub = """\
#!/bin/sh
# Tower Stack — a shell stub prepended to the game's jar, so this one file is both.
exec java -jar "\$0" "\$@"
"""
        def target = outputFile.get().asFile
        target.withOutputStream { out ->
            out.write(stub.getBytes('UTF-8'))
            jarFile.get().asFile.withInputStream { it.transferTo(out) }
        }
        target.setExecutable(true, false)
    }
}

// Note: `distZip` and `distTar` belong to the `application` plugin and bundle the thin jar with
// generated start scripts — a different thing entirely. This is the one to hand to a player.
tasks.register('releaseZip', Zip) {
    group = 'distribution'
    description = 'Zips the README, the jar and the self-running executable for release.'

    archiveFileName = "${distributionName}.zip"
    destinationDirectory = layout.buildDirectory.dir('dist')

    // Everything lands in a folder of its own, so unzipping never scatters files.
    into(distributionName) {
        from tasks.named('dist')
        from tasks.named('distReadme')
        from(tasks.named('executable')) {
            // Zip does record the Unix mode, so `unzip` on Linux and macOS restores this and
            // ./tower-stack works straight out of the archive. Windows ignores it and uses the
            // jar, which needs no permission bit.
            filePermissions { unix(0755) }
        }
    }
}
