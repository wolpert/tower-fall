# libGDX version used across all modules.
gdxVersion=1.13.1

# Build performance / stability.
org.gradle.daemon=true
org.gradle.jvmargs=-Xms512m -Xmx2048m
org.gradle.configureondemand=false

# Android (AGP). We use no AndroidX/support libraries, but the flag keeps AGP quiet.
android.useAndroidX=true
